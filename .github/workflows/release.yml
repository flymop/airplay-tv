name: Release Build & Publish

on:
  push:
    branches:
      - master
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android NDK
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" "cmake;3.22.1"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Compute Short SHA and Release Metadata
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "tag_name=v${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "release_name=Release v${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test native audio playback boundaries
        run: bash tests/native/run_tests.sh

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          SHORT_SHA="${{ steps.meta.outputs.short_sha }}"
          
          # Copy Universal & ABI-specific APKs
          cp app/build/outputs/apk/release/app-universal-release.apk "release-artifacts/AirPlayTV-${SHORT_SHA}-universal.apk"
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk "release-artifacts/AirPlayTV-${SHORT_SHA}-armeabi-v7a.apk"
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "release-artifacts/AirPlayTV-${SHORT_SHA}-arm64-v8a.apk"
          cp app/build/outputs/apk/release/app-x86_64-release.apk "release-artifacts/AirPlayTV-${SHORT_SHA}-x86_64.apk"
          
          cd release-artifacts
          sha256sum *.apk > SHA256SUMS.txt

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          body: |
            ### 📺 AirPlay TV Production Release `${{ steps.meta.outputs.short_sha }}`
            
            **Commit:** [`${{ steps.meta.outputs.short_sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            
            #### 📦 Included Artifacts
            - `AirPlayTV-${{ steps.meta.outputs.short_sha }}-armeabi-v7a.apk`: Lightweight build for 32-bit ARM TVs / TV sticks (~13 MB)
            - `AirPlayTV-${{ steps.meta.outputs.short_sha }}-arm64-v8a.apk`: Lightweight build for 64-bit ARM TVs / Shields (~17 MB)
            - `AirPlayTV-${{ steps.meta.outputs.short_sha }}-x86_64.apk`: Build for x86_64 Android TV / Emulators (~17 MB)
            - `AirPlayTV-${{ steps.meta.outputs.short_sha }}-universal.apk`: All-in-one APK containing all ABIs (~30 MB)
            - `SHA256SUMS.txt`: SHA-256 Checksums for all binaries
            
            #### 🚀 Quick Install via ADB
            ```bash
            adb connect <YOUR_ANDROID_TV_IP>
            # For 32-bit Chromecast with Google TV / Fire TV / Mi Box:
            adb install -r AirPlayTV-${{ steps.meta.outputs.short_sha }}-armeabi-v7a.apk
            ```
          files: |
            release-artifacts/*.apk
            release-artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
